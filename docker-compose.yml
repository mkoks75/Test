# Draait op de Hetzner-server: de applicatie plus haar eigen PostgreSQL.
#
# Zet de waarden in een .env-bestand naast dit bestand (zie .env.example).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Europe/Amsterdam
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Alleen bereikbaar binnen het compose-netwerk; niet open naar buiten.
    expose:
      - "5432"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SESSION_SECRET: ${SESSION_SECRET}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      APP_URL: ${APP_URL:-}
      PORT: 8000
      TZ: Europe/Amsterdam
    ports:
      - "${APP_PORT:-8000}:8000"

  # Dagelijkse dump naar ./backups, veertien dagen bewaard.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c 'while true; do
        pg_dump -h db -U "$$POSTGRES_USER" "$$POSTGRES_DB"
          | gzip > "/backups/voorraad-$$(date +%Y%m%d-%H%M).sql.gz";
        find /backups -name "voorraad-*.sql.gz" -mtime +14 -delete;
        sleep 86400;
      done'
    env_file:
      - .env

volumes:
  pgdata:
